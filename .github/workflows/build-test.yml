name: Build Test

on:
  push:
    # Don't run for tags
    tags-ignore:
      - '**'
    branches:
      - '**'
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build-webos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Point core to upstream ihslib + PIN-masked key exchange
        run: |
          git -C core fetch --depth=1 https://github.com/mariotaku/ihslib.git master
          git -C core checkout FETCH_HEAD
          curl -sL https://github.com/mariotaku/ihslib/pull/4.diff -o /tmp/ihslib-pin.diff
          git -C core apply /tmp/ihslib-pin.diff
          git -C core log --oneline -1

      - name: Download ares-cli-rs
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/ares-cli-rs"
          latest: true
          fileName: "ares-cli-rs-*-linux-x86_64.tar.gz"
          out-file-path: "temp/ares"

      - name: Download Homebrew Toolbox
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/dev-toolbox-cli"
          latest: true
          fileName: "webosbrew-toolbox-*_amd64.deb"
          out-file-path: "temp"

      - name: Install Tools
        run: |
          tar xzf temp/ares/*.tar.gz -C temp/ares
          sudo cp temp/ares/ares-cli-rs-*/ares-* /usr/local/bin/
          sudo chmod +x /usr/local/bin/ares-*
          sudo apt-get install ./temp/*.deb

      - name: Download webOS NDK
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "openlgtv/buildroot-nc4"
          latest: true
          fileName: "arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
          out-file-path: "/tmp"

      - name: Extract webOS NDK
        shell: bash
        working-directory: /tmp
        run: |
          tar xzf arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh

      - name: Build
        env:
          TOOLCHAIN_FILE: /tmp/arm-webos-linux-gnueabi_sdk-buildroot/usr/share/buildroot/toolchainfile.cmake
        run: ./tools/webos/easy_build.sh -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Add Commit Hash Suffix
        shell: bash
        working-directory: dist
        run: for file in *.ipk ; do mv $file ${file//_arm/-${GITHUB_SHA:0:8}_arm} ; done

      - uses: actions/upload-artifact@v4
        with:
          name: webos-snapshot
          path: dist/*.ipk

      - name: Compatibility Check
        run: webosbrew-ipk-verify -f markdown -d -o $GITHUB_STEP_SUMMARY dist/*.ipk

